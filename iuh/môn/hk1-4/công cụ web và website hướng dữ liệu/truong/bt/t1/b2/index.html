<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Danh sách sản phẩm</title>
</head>
<body>

    <button onclick="loadProducts()">Hiển thị danh sách sản phẩm</button>
    <br><br>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Mã SP</th>
                <th>Tên sản phẩm</th>

            </tr>
        </thead>
        <tbody id="product-table-body">
            <!-- Dữ liệu sản phẩm sẽ được nạp vào đây bằng JavaScript -->
        </tbody>
    </table>

    <script src="script.js"></script>

</html>
