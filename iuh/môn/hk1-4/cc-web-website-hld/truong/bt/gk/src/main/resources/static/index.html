<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2: SPA Quản lý Sinh viên theo Khoa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px auto;
            max-width: 800px;
            line-height: 1.5;
        }
        h2, h3 {
            margin-top: 0;
            color: #333;
        }
        .box {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        input, select {
            padding: 6px;
            margin: 4px 6px 4px 0;
        }
        button {
            padding: 6px 12px;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>BÀI 2: QUẢN LÝ SINH VIÊN THEO KHOA (WEB SERVICE - SPA)</h2>

    <!-- ======================================================== -->
    <!-- BƯỚC 1: COMBOBOX CHỌN KHOA                              -->
    <!-- ======================================================== -->
    <div class="box">
        <h3>Bước 1: Danh sách Khoa</h3>
        <label for="facultySelect"><strong>Chọn Khoa: </strong></label>
        <select id="facultySelect" onchange="onFacultyChange()">
            <option value="">-- Vui lòng chọn Khoa --</option>
        </select>
    </div>

    <!-- ======================================================== -->
    <!-- BƯỚC 3: TÌM KIẾM SINH VIÊN TRONG KHOA                   -->
    <!-- ======================================================== -->
    <div class="box">
        <h3>Bước 3: Tìm kiếm Sinh viên</h3>
        <input type="text" id="keyword" placeholder="Nhập tên hoặc email..." onkeyup="searchStudents()">
        <button onclick="searchStudents()">Tìm kiếm</button>
        <button onclick="resetSearch()">Xóa tìm kiếm</button>
    </div>

    <!-- ======================================================== -->
    <!-- BƯỚC 3: FORM THÊM / SỬA SINH VIÊN                       -->
    <!-- ======================================================== -->
    <div class="box">
        <h3 id="formTitle">Bước 3: Thêm Sinh viên mới</h3>
        <input type="hidden" id="studentId">

        <label>Họ tên: </label>
        <input type="text" id="studentName" placeholder="Nhập họ tên sinh viên">

        <label>Email: </label>
        <input type="email" id="studentEmail" placeholder="Nhập email sinh viên">

        <button id="btnSave" onclick="saveStudent()">Thêm</button>
        <button id="btnCancel" onclick="resetForm()" style="display: none;">Hủy</button>
    </div>

    <!-- ======================================================== -->
    <!-- BƯỚC 2: BẢNG DANH SÁCH SINH VIÊN (TABLE)                -->
    <!-- ======================================================== -->
    <div class="box">
        <h3>Bước 2: Danh sách Sinh viên thuộc Khoa</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 40%;">Họ tên</th>
                    <th style="width: 30%;">Email</th>
                    <th style="width: 20%;">Hành động</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr>
                    <td colspan="4" style="text-align: center;">Vui lòng chọn Khoa ở Bước 1</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ======================================================== -->
    <!-- JAVASCRIPT GỌI WEB SERVICE (FETCH API)                   -->
    <!-- ======================================================== -->
    <script>
        const API_URL = '/api';

        // Tự động tải danh sách Khoa khi trang web vừa mở
        window.onload = function() {
            loadFaculties();
        };

        // ========================================================
        // BƯỚC 1: Load danh sách Khoa vào Combobox
        // ========================================================
        function loadFaculties() {
            fetch(`${API_URL}/faculties`)
                .then(response => response.json())
                .then(faculties => {
                    const select = document.getElementById('facultySelect');
                    select.innerHTML = '<option value="">-- Vui lòng chọn Khoa --</option>';
                    faculties.forEach(f => {
                        select.innerHTML += `<option value="${f.id}">${f.name}</option>`;
                    });
                })
                .catch(err => console.error('Lỗi tải danh sách khoa:', err));
        }

        // ========================================================
        // BƯỚC 2: Khi chọn Khoa -> Gọi Web Service trả JSON -> Load Table
        // ========================================================
        function onFacultyChange() {
            const facultyId = document.getElementById('facultySelect').value;
            if (!facultyId) {
                document.getElementById('studentTableBody').innerHTML = 
                    '<tr><td colspan="4" style="text-align: center;">Vui lòng chọn Khoa ở Bước 1</td></tr>';
                return;
            }
            loadStudents(facultyId);
            resetForm();
        }

        function loadStudents(facultyId, keyword = '') {
            let url = `${API_URL}/faculties/${facultyId}/students`;
            if (keyword) {
                url += `?keyword=${encodeURIComponent(keyword)}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(students => {
                    renderTable(students);
                })
                .catch(err => console.error('Lỗi tải danh sách sinh viên:', err));
        }

        function renderTable(students) {
            const tbody = document.getElementById('studentTableBody');
            if (!students || students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Khoa này hiện chưa có sinh viên nào</td></tr>';
                return;
            }

            let html = '';
            students.forEach(s => {
                html += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td>${s.email}</td>
                        <td>
                            <button onclick="editStudent(${s.id}, '${s.name}', '${s.email}')">Sửa</button>
                            <button onclick="deleteStudent(${s.id})">Xóa</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ========================================================
        // BƯỚC 3: TÌM KIẾM SINH VIÊN
        // ========================================================
        function searchStudents() {
            const facultyId = document.getElementById('facultySelect').value;
            if (!facultyId) return;
            const keyword = document.getElementById('keyword').value.trim();
            loadStudents(facultyId, keyword);
        }

        function resetSearch() {
            document.getElementById('keyword').value = '';
            const facultyId = document.getElementById('facultySelect').value;
            if (facultyId) {
                loadStudents(facultyId);
            }
        }

        // ========================================================
        // BƯỚC 3: THÊM MỚI (POST) & SỬA (PUT) SINH VIÊN
        // ========================================================
        function saveStudent() {
            const facultyId = document.getElementById('facultySelect').value;
            if (!facultyId) {
                alert('Vui lòng chọn Khoa ở Bước 1 trước!');
                return;
            }

            const id = document.getElementById('studentId').value;
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();

            if (!name || !email) {
                alert('Vui lòng nhập đầy đủ Họ tên và Email!');
                return;
            }

            const studentData = { name: name, email: email };

            if (!id) {
                // 1. THÊM MỚI (POST)
                fetch(`${API_URL}/faculties/${facultyId}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                })
                .then(response => response.json())
                .then(() => {
                    resetForm();
                    loadStudents(facultyId);
                })
                .catch(err => alert('Lỗi thêm sinh viên: ' + err));
            } else {
                // 2. SỬA / CẬP NHẬT (PUT)
                fetch(`${API_URL}/faculties/${facultyId}/students/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                })
                .then(response => response.json())
                .then(() => {
                    resetForm();
                    loadStudents(facultyId);
                })
                .catch(err => alert('Lỗi sửa sinh viên: ' + err));
            }
        }

        // Đổ dữ liệu dòng cần sửa lên Form
        function editStudent(id, name, email) {
            document.getElementById('studentId').value = id;
            document.getElementById('studentName').value = name;
            document.getElementById('studentEmail').value = email;
            document.getElementById('formTitle').innerText = 'Bước 3: Sửa Sinh viên (ID: ' + id + ')';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            document.getElementById('btnCancel').style.display = 'inline-block';
        }

        // Đưa form về trạng thái Thêm mới ban đầu
        function resetForm() {
            document.getElementById('studentId').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('studentEmail').value = '';
            document.getElementById('formTitle').innerText = 'Bước 3: Thêm Sinh viên mới';
            document.getElementById('btnSave').innerText = 'Thêm';
            document.getElementById('btnCancel').style.display = 'none';
        }

        // ========================================================
        // BƯỚC 3: XÓA SINH VIÊN (DELETE)
        // ========================================================
        function deleteStudent(studentId) {
            const facultyId = document.getElementById('facultySelect').value;
            if (!confirm('Bạn có chắc chắn muốn xóa sinh viên ID ' + studentId + ' không?')) {
                return;
            }

            fetch(`${API_URL}/faculties/${facultyId}/students/${studentId}`, {
                method: 'DELETE'
            })
            .then(() => {
                loadStudents(facultyId);
            })
            .catch(err => alert('Lỗi xóa sinh viên: ' + err));
        }
    </script>
</body>
</html>
