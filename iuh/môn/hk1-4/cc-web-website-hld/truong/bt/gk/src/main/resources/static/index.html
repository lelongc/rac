<!DOCTYPE html>
<!-- 
====================================================================================================
⚡ CẨM NANG "THẦN CHÚ" ĐỔI TÊN TOÀN BỘ 100% (ĐỔI CẢ TÊN HÀM, ID, BIẾN, URL & GIAO DIỆN)
⚡ DÀNH CHO CẢ 2 TRƯỜNG HỢP: (1) CÓ SẴN WEBSERVICE  và  (2) THẦY KHÔNG CHO WEBSERVICE
====================================================================================================

Khi vào phòng thi, nếu đề bài là Danh mục & Sản phẩm, Phòng ban & Nhân viên... bạn cần đổi
TOÀN BỘ tên hàm (saveProduct, editProduct, loadProducts...) để khi thầy chấm bài, thầy thấy tên hàm chuẩn
theo đúng đề bài, không thể bắt bẻ hay nghi ngờ copy bài.

----------------------------------------------------------------------------------------------------
🎯 HƯỚNG DẪN DÙNG TÍNH NĂNG "MATCH CASE" (PHÂN BIỆT HOA/THƯỜNG) ĐỂ THAY THẾ TOÀN BỘ:
----------------------------------------------------------------------------------------------------
BẮT BUỘC BẬT TÍNH NĂNG PHÂN BIỆT CHỮ HOA / CHỮ THƯỜNG TRƯỚC KHI TÌM KIẾM:
- Trong Eclipse:   Bấm [ Ctrl + F ] -> Đánh dấu tick vào ô [x] Case sensitive
- Trong VS Code:   Bấm [ Ctrl + H ] -> Bấm vào biểu tượng chữ [ Aa ] (hoặc nhấn Alt + C)
- Trong Notepad++: Bấm [ Ctrl + H ] -> Đánh dấu tick vào ô [x] Match case

Sau đó, lần lượt gõ từng cặp từ dưới đây và bấm nút "REPLACE ALL" (Thay thế toàn bộ):

====================================================================================================
🔥 BẢNG 12 BƯỚC ĐỔI TÊN ĐỒNG LOẠT (VÍ DỤ ĐỀ: DANH MỤC & SẢN PHẨM)
====================================================================================================
| BƯỚC | TÌM TỪ NÀY (Find) | THAY BẰNG TỪ NÀY (Replace) | PHẠM VI ẢNH HƯỞNG TRONG CODE             |
| :---:| :---------------- | :------------------------- | :--------------------------------------- |
|  1   | Faculties         | Categories                 | Tên hàm: loadFaculties -> loadCategories |
|  2   | faculties         | categories                 | Đường dẫn URL API Cha: /api/categories   |
|  3   | Faculty           | Category                   | Tên hàm: onFacultyChange -> onCategoryChange |
|  4   | faculty           | category                   | ID thẻ HTML: categorySelect, parentId    |
|  5   | Students          | Products                   | Tên hàm: loadProducts, searchProducts    |
|  6   | students          | products                   | Đường dẫn URL API Con: /products         |
|  7   | Student           | Product                    | Tên hàm: saveProduct, editProduct, deleteProduct |
|  8   | student           | product                    | ID thẻ HTML: productId, productName, productTableBody |
|  9   | email             | price                      | Thuộc tính JSON: s.price, price: price   |
|  10  | Email             | Đơn giá                    | Tiêu đề cột Bảng & nhãn ô nhập form      |
|  11  | Khoa              | Danh mục                   | Tiêu đề & nhãn Combobox tiếng Việt       |
|  12  | Sinh viên         | Sản phẩm                   | Tiêu đề trang & form tiếng Việt          |
----------------------------------------------------------------------------------------------------
👉 KẾT QUẢ SAU 12 LẦN BẤM REPLACE ALL:
- 100% tên hàm trở thành: loadCategories(), onCategoryChange(), loadProducts(), searchProducts(),
                          saveProduct(), editProduct(), deleteProduct().
- 100% ID thẻ HTML trở thành: categorySelect, productId, productName, productPrice, productTableBody.
- 100% URL API trở thành: /api/categories, /api/categories/${parentId}/products.
- Thầy xem code thấy chuẩn chỉ 100%, không còn vương lại bất kỳ một chữ "Student" hay "Faculty" nào!

====================================================================================================
⚡ TRƯỜNG HỢP 2: NẾU THẦY "KHÔNG CHO WEBSERVICE" (BẮT TỰ VIẾT HOẶC TỰ CHẠY BACKEND)
====================================================================================================
Nếu thầy không cho sẵn Web Service chạy riêng mà bắt nộp cả project Spring Boot:
Bạn dùng ngay project Spring Boot này, mở Eclipse lên và dùng chức năng REFACTOR RENAME (Alt + Shift + R):

1. ĐỔI MODEL CHA:
   - Mở file `Faculty.java` -> Bôi đen chữ `Faculty` ở dòng `public class Faculty`
   - Bấm phím [ Alt + Shift + R ] (hoặc chuột phải -> Refactor -> Rename) -> Gõ `Category` -> Enter.
   - Eclipse sẽ TỰ ĐỘNG đổi tên file thành `Category.java` và đổi toàn bộ nơi gọi trong cả project!

2. ĐỔI MODEL CON:
   - Mở file `Student.java` -> Bấm [ Alt + Shift + R ] -> Đổi thành `Product`.
   - Trong `Product.java`: Đổi `private String email;` thành `private Double price;` (hoặc String price).

3. ĐỔI SERVICE:
   - Mở file `FacultyService.java` -> Bấm [ Alt + Shift + R ] -> Đổi thành `CategoryService`.

4. ĐỔI CONTROLLER:
   - Mở file `FacultyController.java` -> Bấm [ Alt + Shift + R ] -> Đổi thành `CategoryController`.
   - Trong file này, sửa các URL `@GetMapping`:
     + `/api/faculties` -> `/api/categories`
     + `/api/faculties/{facultyId}/students` -> `/api/categories/{categoryId}/products`

5. CHẠY BACKEND:
   - Bấm chuột phải vào `GkApplication.java` -> Run As -> Spring Boot App.
   - Backend sẽ chạy tại cổng `8084` (hoặc cổng trong `application.properties`).
   - File `index.html` của bạn chỉ việc gọi tới cổng đó là xong trọn vẹn cả bài thi 10 điểm!

====================================================================================================
📋 BẢNG TRA TỪ KHÓA CHO CÁC BỘ ĐỀ THI HAY GẶP NHẤT TẠI IUH:
====================================================================================================
1. ĐỀ BÀI: DANH MỤC & SẢN PHẨM (Category & Product)
   - Cha:  Faculties -> Categories  | faculties -> categories | Faculty -> Category | faculty -> category | Khoa -> Danh mục
   - Con:  Students -> Products    | students -> products   | Student -> Product  | student -> product  | Sinh viên -> Sản phẩm
   - Cột:  email -> price          | Email -> Đơn giá

2. ĐỀ BÀI: PHÒNG BAN & NHÂN VIÊN (Department & Employee)
   - Cha:  Faculties -> Departments | faculties -> departments | Faculty -> Department | faculty -> department | Khoa -> Phòng ban
   - Con:  Students -> Employees   | students -> employees   | Student -> Employee  | student -> employee  | Sinh viên -> Nhân viên
   - Cột:  email -> salary         | Email -> Tiền lương

3. ĐỀ BÀI: LỚP HỌC & SINH VIÊN (Classroom & Student)
   - Cha:  Faculties -> Classrooms | faculties -> classrooms | Faculty -> Classroom | faculty -> classroom | Khoa -> Lớp học
   - Con:  Students giữ nguyên     | students giữ nguyên     | Student giữ nguyên   | student giữ nguyên   | Sinh viên giữ nguyên
   - Cột:  email -> phone          | Email -> Số điện thoại

4. ĐỀ BÀI: TÁC GIẢ & SÁCH (Author & Book)
   - Cha:  Faculties -> Authors    | faculties -> authors    | Faculty -> Author    | faculty -> author    | Khoa -> Tác giả
   - Con:  Students -> Books       | students -> books       | Student -> Book      | student -> book      | Sinh viên -> Sách
   - Cột:  email -> price          | Email -> Giá bán
====================================================================================================
-->
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý dữ liệu Web Service (SPA)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px auto;
            max-width: 850px;
            line-height: 1.5;
        }
        h2, h3 {
            margin-top: 0;
            color: #333;
        }
        .box {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        input, select {
            padding: 6px;
            margin: 4px 6px 4px 0;
        }
        button {
            padding: 6px 12px;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ========================================================================= -->
    <!-- TIÊU ĐỀ CHÍNH CỦA TRANG WEB                                               -->
    <!-- [THAY Ở ĐÂY NẾU ĐỀ KHÁC]:                                                -->
    <!-- Ví dụ: QUẢN LÝ SẢN PHẨM THEO DANH MỤC / QUẢN LÝ NHÂN VIÊN THEO PHÒNG BAN  -->
    <!-- ========================================================================= -->
    <h2>QUẢN LÝ SINH VIÊN THEO KHOA</h2>

    <!-- ========================================================================= -->
    <!-- ========================================================================= -->
    <!-- [VỊ TRÍ ĐỔI TÊN 1/4]: COMBOBOX CHỌN ĐỐI TƯỢNG CHA (Khoa / Danh mục / Phòng ban) -->
    <!-- ========================================================================= -->
    <div class="box">
        <h3>Chọn Khoa</h3>
        <!-- Thay thế đồng loạt: 'Khoa' -> 'Danh mục' hoặc 'Phòng ban' -->
        <label for="facultySelect"><strong>Khoa: </strong></label>
        
        <!-- Sự kiện onchange: Khi người dùng click chọn 1 item khác thì tự gọi hàm onFacultyChange() -->
        <select id="facultySelect" onchange="onFacultyChange()">
            <option value="">-- Vui lòng chọn Khoa --</option>
        </select>
    </div>

    <!-- ========================================================================= -->
    <!-- PHẦN 2: TÌM KIẾM ĐỐI TƯỢNG CON (Sinh viên / Sản phẩm / Nhân viên)          -->
    <!-- ========================================================================= -->
    <div class="box">
        <h3>Tìm kiếm</h3>
        <input type="text" id="keyword" placeholder="Nhập từ khóa tìm kiếm..." oninput="searchStudents()">
        <button onclick="searchStudents()">Tìm kiếm</button>
    </div>

    <!-- ========================================================================= -->
    <!-- PHẦN 3: FORM THÊM MỚI & CHỈNH SỬA (DÙNG CHUNG FORM)                        -->
    <!-- ========================================================================= -->
    <div class="box">
        <h3 id="formTitle">Thêm mới</h3>
        <!-- studentId: Lưu ID ẩn. Nếu rỗng => THÊM MỚI (POST). Nếu có số => CẬP NHẬT (PUT) -->
        <input type="hidden" id="studentId">

        <!-- [VỊ TRÍ ĐỔI TÊN 3/4]: Các ô nhập liệu theo đề bài -->
        <!-- Mặc định: Họ tên (studentName) và Email (studentEmail) -->
        <!-- Khi thay thế đồng loạt 'email' -> 'price': ô này tự động thành studentPrice -->
        <label>Họ tên: </label>
        <input type="text" id="studentName" placeholder="Nhập họ tên...">

        <label>Email: </label>
        <input type="text" id="studentEmail" placeholder="Nhập thông tin...">

        <!-- Nút bấm: Mặc định là 'Thêm', khi bấm Sửa ở bảng thì đổi chữ thành 'Cập nhật' -->
        <button id="btnSave" onclick="saveStudent()">Thêm</button>
        <button id="btnCancel" onclick="resetForm()" style="display: none;">Hủy</button>
    </div>

    <!-- ========================================================================= -->
    <!-- ========================================================================= -->
    <!-- [VỊ TRÍ ĐỔI TÊN 2/4]: BẢNG HIỂN THỊ DANH SÁCH ĐỐI TƯỢNG CON (Sinh viên / Sản phẩm) -->
    <!-- ========================================================================= -->
    <div class="box">
        <h3>Danh sách hiển thị</h3>
        <table>
            <thead>
                <tr>
                    <!-- Khi thay thế đồng loạt: 'Email' -> 'Đơn giá' hoặc 'Tiền lương' -->
                    <th style="width: 10%;">ID</th>
                    <th style="width: 40%;">Họ tên</th>
                    <th style="width: 30%;">Email</th>
                    <th style="width: 20%;">Hành động</th>
                </tr>
            </thead>
            <!-- Dữ liệu từ API sẽ được Javascript vẽ vào thẻ tbody này -->
            <tbody id="studentTableBody">
                <tr>
                    <td colspan="4" style="text-align: center;">Vui lòng chọn mục ở trên để xem danh sách</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ========================================================================= -->
    <!-- PHẦN 5: JAVASCRIPT GỌI WEB SERVICE (FETCH API)                            -->
    <!-- ========================================================================= -->
    <script>
        // =====================================================================
        // [CỰC KỲ QUAN TRỌNG - THAY Ở ĐÂY NẾU ĐỀ BÀI CHO LINK HOẶC PORT KHÁC]:
        // - Nếu chạy cùng project Spring Boot: để '/api' hoặc ''
        // - Nếu thầy cho sẵn link Web Service chạy riêng ở port khác:
        //   Ví dụ: const API_URL = 'http://localhost:8080/api';
        // =====================================================================
        const API_URL = '/api';

        // Tự động kích hoạt khi trang web vừa tải xong
        window.onload = function() {
            loadFaculties();
        };

        // =====================================================================
        // BƯỚC 1: LẤY DANH SÁCH ĐỐI TƯỢNG CHA ĐỔ VÀO COMBOBOX (<select>)
        // [ĐỔI TÊN HÀM BƯỚC 1]: loadFaculties() -> loadCategories() (Thay: Faculties -> Categories)
        // [ĐỔI URL BƯỚC 2]:     ${API_URL}/faculties -> ${API_URL}/categories
        // =====================================================================
        function loadFaculties() {
            fetch(`${API_URL}/faculties`)
                .then(response => response.json())
                .then(list => {
                    const select = document.getElementById('facultySelect');
                    select.innerHTML = '<option value="">-- Vui lòng chọn --</option>';
                    list.forEach(item => {
                        // [LƯU Ý]: item.id và item.name (hoặc item.categoryName nếu JSON backend đặt khác)
                        select.innerHTML += `<option value="${item.id}">${item.name}</option>`;
                    });
                })
                .catch(err => console.error('Lỗi tải combobox:', err));
        }

        // =====================================================================
        // BƯỚC 2: KHI CHỌN 1 ITEM TRONG COMBOBOX -> GỌI API LẤY DANH SÁCH CON
        // [ĐỔI TÊN HÀM BƯỚC 3]: onFacultyChange() -> onCategoryChange() (Thay: Faculty -> Category)
        // =====================================================================
        function onFacultyChange() {
            const parentId = document.getElementById('facultySelect').value;
            if (!parentId) {
                document.getElementById('studentTableBody').innerHTML = 
                    '<tr><td colspan="4" style="text-align: center;">Vui lòng chọn mục ở trên</td></tr>';
                return;
            }
            // Gọi hàm lấy danh sách con
            loadStudents(parentId);
            // Đưa form nhập liệu về trạng thái rỗng ban đầu
            resetForm();
        }

        // =====================================================================
        // [ĐỔI TÊN HÀM BƯỚC 5]: loadStudents() -> loadProducts() (Thay: Students -> Products)
        // [ĐỔI URL BƯỚC 6]:     .../faculties/.../students -> .../categories/.../products
        // =====================================================================
        function loadStudents(parentId, keyword = '') {
            let url = `${API_URL}/faculties/${parentId}/students`;
            
            // Nếu có từ khóa tìm kiếm thì gắn thêm tham số ?keyword=...
            if (keyword) {
                url += `?keyword=${encodeURIComponent(keyword)}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(childList => {
                    renderTable(childList);
                })
                .catch(err => console.error('Lỗi tải danh sách con:', err));
        }

        // =====================================================================
        // HÀM VẼ DỮ LIỆU JSON VÀO THẺ BẢNG (TABLE)
        // [ĐỔI THUỘC TÍNH BƯỚC 9]: s.email -> s.price (Thay: email -> price)
        // =====================================================================
        function renderTable(childList) {
            const tbody = document.getElementById('studentTableBody');
            
            // Nếu danh sách rỗng (chưa có con nào)
            if (!childList || childList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Chưa có dữ liệu nào</td></tr>';
                return;
            }

            let html = '';
            childList.forEach(s => {
                html += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td>${s.email}</td>
                        <td>
                            <!-- Nút Sửa: Truyền các giá trị của dòng này lên form để chỉnh sửa -->
                            <button onclick="editStudent(${s.id}, '${s.name}', '${s.email}')">Sửa</button>
                            <!-- Nút Xóa: Truyền ID của dòng này để gửi lệnh DELETE -->
                            <button onclick="deleteStudent(${s.id})">Xóa</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // =====================================================================
        // TÌM KIẾM DỮ LIỆU (HỖ TRỢ CẢ VỪA GÕ VỪA TÌM VÀ BẤM NÚT)
        // [ĐỔI TÊN HÀM BƯỚC 5]: searchStudents() -> searchProducts() (Thay: Students -> Products)
        // =====================================================================
        function searchStudents() {
            const parentId = document.getElementById('facultySelect').value;
            if (!parentId) return; // Nếu chưa chọn Khoa thì không làm gì
            const keyword = document.getElementById('keyword').value.trim();
            loadStudents(parentId, keyword);
        }

        // =====================================================================
        // BƯỚC 3: THÊM MỚI (POST) HOẶC CẬP NHẬT (PUT) DỮ LIỆU
        // [ĐỔI TÊN HÀM BƯỚC 7]: saveStudent() -> saveProduct() (Thay: Student -> Product)
        // =====================================================================
        function saveStudent() {
            const parentId = document.getElementById('facultySelect').value;
            if (!parentId) {
                alert('Vui lòng chọn mục ở Bước 1 trước!');
                return;
            }

            const id = document.getElementById('studentId').value;
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();

            if (!name || !email) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            const requestData = { 
                name: name, 
                email: email 
            };

            if (!id) {
                // -------------------------------------------------------------
                // THÊM MỚI: Dùng phương thức POST
                // URL: ${API_URL}/faculties/${parentId}/students
                // -------------------------------------------------------------
                fetch(`${API_URL}/faculties/${parentId}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                })
                .then(response => response.json())
                .then(() => {
                    resetForm();               // Xóa trắng form
                    loadStudents(parentId);    // Load lại bảng để thấy dòng vừa thêm
                })
                .catch(err => alert('Lỗi thêm mới: ' + err));
            } else {
                // -------------------------------------------------------------
                // SỬA / CẬP NHẬT: Dùng phương thức PUT
                // URL: ${API_URL}/faculties/${parentId}/students/${id}
                // -------------------------------------------------------------
                fetch(`${API_URL}/faculties/${parentId}/students/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                })
                .then(response => response.json())
                .then(() => {
                    resetForm();               // Xóa trắng form
                    loadStudents(parentId);    // Load lại bảng để thấy dữ liệu mới
                })
                .catch(err => alert('Lỗi cập nhật: ' + err));
            }
        }

        // [ĐỔI TÊN HÀM BƯỚC 7]: editStudent() -> editProduct() (Thay: Student -> Product)
        function editStudent(id, name, email) {
            document.getElementById('studentId').value = id;
            document.getElementById('studentName').value = name;
            document.getElementById('studentEmail').value = email;
            
            // Đổi tiêu đề form và tên nút bấm sang chế độ Cập nhật
            document.getElementById('formTitle').innerText = 'Sửa thông tin (ID: ' + id + ')';
            document.getElementById('btnSave').innerText = 'Cập nhật';
            document.getElementById('btnCancel').style.display = 'inline-block';
        }

        // Đưa form về lại trạng thái Thêm mới
        function resetForm() {
            document.getElementById('studentId').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('studentEmail').value = '';
            document.getElementById('formTitle').innerText = 'Thêm mới';
            document.getElementById('btnSave').innerText = 'Thêm';
            document.getElementById('btnCancel').style.display = 'none';
        }

        // =====================================================================
        // BƯỚC 3: XÓA DỮ LIỆU (DELETE)
        // [ĐỔI TÊN HÀM BƯỚC 7]: deleteStudent() -> deleteProduct() (Thay: Student -> Product)
        // =====================================================================
        function deleteStudent(studentId) {
            const parentId = document.getElementById('facultySelect').value;
            if (!confirm('Bạn có chắc chắn muốn xóa ID ' + studentId + ' không?')) {
                return;
            }

            // Gửi request DELETE lên Server
            fetch(`${API_URL}/faculties/${parentId}/students/${studentId}`, {
                method: 'DELETE'
            })
            .then(() => {
                loadStudents(parentId); // Load lại bảng để mất dòng vừa xóa
            })
            .catch(err => alert('Lỗi xóa: ' + err));
        }
    </script>
</body>
</html>
