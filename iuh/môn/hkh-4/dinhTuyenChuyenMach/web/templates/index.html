<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE-NG Full-Stack Orchestrator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>EVE-NG <span>Orchestrator</span></h1>
            <p>1-Click: AI vẽ sơ đồ ➜ Tự động SSH ➜ Tự bật Router ➜ Cấu hình & Báo cáo.</p>
        </header>
        
        <main class="grid-layout">
            <section class="glass-panel input-section">
                <div class="input-group">
                    <label for="apiKey">Gemini API Key</label>
                    <input type="password" id="apiKey" placeholder="Nhập Gemini API Key của bạn..." autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="prompt">Đề bài (Mô tả mạng)</label>
                    <textarea id="prompt" placeholder="Ví dụ: Tạo mạng gồm 3 router West, Central, East..." rows="12"></textarea>
                </div>
                
                <button id="generateBtn" class="primary-btn">
                    <span class="btn-text">🚀 CHẠY TỰ ĐỘNG TOÀN DIỆN</span>
                    <div class="spinner hidden" id="loadingSpinner"></div>
                </button>
            </section>
            
            <section class="glass-panel output-section">
                <div class="output-header">
                    <h2>Terminal / Report</h2>
                    <div class="actions">
                        <button id="downloadTxtBtn" class="icon-btn hidden" title="Tải Giải thích lệnh">📄 TXT (Giải thích)</button>
                        <button id="downloadCsvBtn" class="icon-btn hidden" title="Tải Bảng IP">📊 Excel (Bảng IP)</button>
                        <button id="copyBtn" class="icon-btn" title="Copy to Clipboard" disabled>📋 Copy Report</button>
                    </div>
                </div>
                <div class="code-container">
                    <pre><code id="outputCode">Sẵn sàng chờ lệnh...</code></pre>
                </div>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
