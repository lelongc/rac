<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2: Tính thành tiền</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 10px; width: 250px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 10px; padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
        #tongTien { margin-top: 15px; font-size: 1.2em; color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Tính hóa đơn</h2>
    <div class="form-group">
        <label>Đơn giá:</label>
        <input type="number" id="donGia" placeholder="Nhập giá tiền">
    </div>
    <div class="form-group">
        <label>Số lượng:</label>
        <input type="number" id="soLuong" placeholder="Nhập số lượng">
    </div>

    <button onclick="tinhToan()">Thành tiền</button>

    <p id="tongTien">Thành tiền: 0 VND</p>

    <script>
        function tinhToan() {
            // Lấy dữ liệu từ DOM
            const gia = document.getElementById('donGia').value;
            const sl = document.getElementById('soLuong').value;

            // Kiểm tra đầu vào
            if (gia <= 0 || sl <= 0) {
                alert("Vui lòng nhập số dương!");
                return;
            }

            // Tính toán
            const thanhTien = gia * sl;

            // Hiển thị kết quả (định dạng số cho đẹp)
            document.getElementById('tongTien').innerText = "Thành tiền: " + thanhTien.toLocaleString('vi-VN') + " VND";
        }
    </script>
</body>
</html>
