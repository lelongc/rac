<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách môn học</title>
    <style>
        /* CSS để tạo màu nền vàng cho bảng giống trong ảnh */
        table {
            background-color: yellow;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 4px 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h2>Danh sách môn học</h2>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên môn học</th>
                <th>Số tín chỉ</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Toán cao cấp</td>
                <td>3</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Điện toán đám mây</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Quản trị mạng và hỗ trợ kỹ thuật</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Mạng máy tính</td>
                <td>3</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Triển khai an ninh hệ thống</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
